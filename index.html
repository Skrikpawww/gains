<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes finances</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a0a0b;
  --card:rgba(18,18,20,.82);
  --card-solid:#141416;
  --line:rgba(212,175,55,.22);
  --line-soft:rgba(255,255,255,.07);
  --gold:#d4af37;
  --gold-hi:#f4d77b;
  --gold-lo:#8f6f1c;
  --gold-grad:linear-gradient(135deg,#f7dd86 0%,#d4af37 45%,#a07c1e 100%);
  --text:#f2eee3;
  --muted:#9a9486;
  --green:#4fcf8e;
  --blue:#5aa9ff;
  --red:#ff6b6b;
  --radius:16px;
  --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;touch-action:pan-y;overscroll-behavior-x:none;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);font-size:15px;line-height:1.4;min-height:100vh;min-height:100dvh;
  background:var(--bg) url(carbon.jpg) repeat;background-size:400px 400px;background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(212,175,55,.10),transparent 60%),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55));pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.ic{display:block;flex:none}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* ---------- Connexion ---------- */
.screen{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);text-align:center}
.login-logo{width:96px;height:96px;border-radius:22px;margin:0 auto 14px;display:block;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 1px var(--line)}
.login-card h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(0,0,0,.45);padding:0 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
textarea.input{height:auto;min-height:72px;padding:12px 14px;resize:vertical}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date].input{line-height:46px;padding:0 14px;min-width:0}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.input::placeholder{color:#6b665a}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;text-align:left}
.alert.error{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffb0b0}
.alert.ok{background:rgba(79,207,142,.12);border:1px solid rgba(79,207,142,.4);color:#a8f0cb}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:transform .08s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold-grad);color:#1a1405;border-color:transparent;box-shadow:0 6px 20px rgba(212,175,55,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-danger{color:var(--red);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.btn-block{width:100%}
.btn-sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-soft);background:rgba(255,255,255,.04);color:var(--gold-hi);flex:none}
.icon-btn:active{transform:scale(.94)}

/* ---------- Structure ---------- */
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex}
.sidebar{display:none}
.main{flex:1;min-width:0;width:100%;padding:calc(14px + var(--safe-t)) 14px calc(var(--tab-h) + var(--safe-b) + 28px)}
.container{width:100%;max-width:920px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.topbar .brand span{font-weight:700;font-size:17px;letter-spacing:.3px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.page-head h2{margin:0;font-size:24px;letter-spacing:.2px;min-width:0}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.head-actions{display:flex;gap:8px;align-items:center;flex:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(10,10,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0;position:relative}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.active{color:var(--gold-hi)}
.tab.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:0 0 3px 3px;background:var(--gold-grad)}

@media (min-width:900px){
  .tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;background:rgba(8,8,9,.82);border-right:1px solid var(--line);backdrop-filter:blur(10px)}
  .sidebar .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding:0 6px}
  .sidebar .brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
  .sidebar .brand b{font-size:18px;letter-spacing:.3px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;border-radius:12px;color:var(--muted);font-weight:600;margin-bottom:4px;text-align:left}
  .nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .nav-item.active{color:#1a1405;background:var(--gold-grad)}
  .sidebar .spacer{flex:1}
  .main{padding:32px 36px 48px}
  .topbar{display:none}
}

/* ---------- Cartes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);margin-bottom:12px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(20,20,22,.9) 55%),var(--card-solid);border-color:rgba(212,175,55,.45);padding:20px 18px}
.hero .label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#cdbf94}
.hero .big{font-size:38px;font-weight:800;margin:6px 0 4px;letter-spacing:-.5px;line-height:1.1}
.hero .note{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-home{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:13px 12px;min-width:0;cursor:default}
.stat.link{cursor:pointer;border-color:var(--line)}
.stat.link:active{transform:scale(.98)}
.stat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:19px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--green)}.neg{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold-hi)}.muted{color:var(--muted)}

.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:6px;margin-bottom:12px}
.month-nav .lbl{font-weight:700;text-transform:capitalize;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:rgba(0,0,0,.45);border:1px solid var(--line-soft);border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{height:40px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.seg button.active{background:var(--gold-grad);color:#1a1405}
.seg.work button.active.off{background:linear-gradient(135deg,#ff8a8a,#d94c4c);color:#fff}
.seg.work button.active.on{background:linear-gradient(135deg,#6be3a5,#2fae70);color:#06170e}

/* ---------- Listes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px;min-width:0;width:100%;text-align:left}
.row.click{cursor:pointer}.row.click:active{background:rgba(212,175,55,.08)}
.row .dot{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);background:rgba(212,175,55,.08);color:var(--gold-hi)}
.row .dot.green{color:var(--green);border-color:rgba(79,207,142,.4);background:rgba(79,207,142,.1)}
.row .dot.blue{color:var(--blue);border-color:rgba(90,169,255,.4);background:rgba(90,169,255,.1)}
.row .dot.red{color:var(--red);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .amt{font-weight:700;white-space:nowrap;text-align:right;flex:none}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);background:rgba(212,175,55,.08)}
.tag.red{color:var(--red);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.tag.green{color:var(--green);border-color:rgba(79,207,142,.4);background:rgba(79,207,142,.08)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(212,175,55,.2);border-top-color:var(--gold);animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold-grad)}
.bar.green i{background:linear-gradient(90deg,#6be3a5,#2fae70)}
.cat-line{margin-bottom:12px}.cat-line:last-child{margin-bottom:0}
.cat-line .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:14px}
.cat-line .h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-line .h b{white-space:nowrap}

/* ---------- Calendrier ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px;text-transform:uppercase}
.cal .cell{aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line-soft);background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;min-width:0;position:relative}
.cal .cell small{font-size:9.5px;font-weight:600;opacity:.85;margin-top:1px}
.cal .cell.empty-c{border:0;background:none}
.cal .cell.worked{background:rgba(79,207,142,.18);border-color:rgba(79,207,142,.55);color:#b4f5d3}
.cal .cell.recharge{background:rgba(90,169,255,.2);border-color:rgba(90,169,255,.6);color:#c3e0ff}
.cal .cell.off{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.55);color:#ffc0c0}
.cal .cell.today{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- Épargne ---------- */
.bill{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.bill:first-of-type{border-top:0}
.bill .glyph{width:72px;flex:none;font-weight:800;font-size:18px}
.bill .sub{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--gold-hi);display:flex;align-items:center;justify-content:center}
.stepper button:active{transform:scale(.92)}
.stepper input{width:48px;height:36px;text-align:center;border-radius:10px;border:1px solid var(--line-soft);background:rgba(0,0,0,.45);font-size:16px;font-weight:700;outline:none;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sv-status{font-size:12px;color:var(--muted)}
.total-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.total-bar b{font-size:20px;white-space:nowrap}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;background:#101012 url(carbon.jpg);background-size:400px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));transform:translateY(30px);transition:transform .22s;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.overlay.show .sheet{transform:none}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:-6px auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
@media (min-width:900px){.overlay{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);padding-bottom:18px}.sheet::before{display:none}}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(0,0,0,.4);margin-bottom:14px;cursor:pointer;min-width:0}
.switch-row .l{min-width:0}.switch-row .l b{display:block}.switch-row .l small{color:var(--muted)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:#2a2a2d;border:1px solid var(--line-soft);transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#bdb8aa;transition:.2s}
.switch input:checked+i{background:var(--gold-grad);border-color:transparent}
.switch input:checked+i::after{transform:translateX(20px);background:#fff}
.preview{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(212,175,55,.1);border:1px solid var(--line);margin-bottom:14px}
.preview b{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-soft);background:rgba(0,0,0,.4);color:var(--muted);font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.active{background:var(--gold-grad);color:#1a1405;border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);background:#1c1c1f;border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:99px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,107,107,.6);color:#ffb0b0}
@media (min-width:900px){.toast{bottom:28px}}
.sub-cats{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--gold-hi);font-weight:600;height:36px;margin-bottom:6px}
</style>
</head>
<body>

<!-- Chargement de la session -->
<div id="restoreScreen" class="screen hidden"><div class="loading"><div class="spin"></div>Connexion…</div></div>

<!-- Connexion -->
<div id="loginScreen" class="screen hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <img class="login-logo" src="icon-192.png" alt="">
    <h1 class="gold-text">Mes finances</h1>
    <p>Accès personnel</p>
    <div id="loginAlert"></div>
    <div class="field"><label for="loginUser">Identifiant</label><input class="input" id="loginUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="loginPass">Mot de passe</label><input class="input" id="loginPass" name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Se connecter</button>
  </form>
</div>

<!-- Application -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="container">
    <div class="topbar">
      <div class="brand"><img src="icon-192.png" alt=""><span class="gold-text">Mes finances</span></div>
      <button class="icon-btn" id="menuBtnTop" aria-label="Compte"></button>
    </div>
    <div id="page"></div>
  </div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== URL du déploiement Apps Script ===== */
var API_URL = "https://script.google.com/macros/s/AKfycby-mpCTFwe2iaCW5HB4wInKVkTV0EjVJ2rxOx2cFhs3dyYtNgFUbsM1Dx2IPK4Hz4be/exec";

function rawApi(action, args) {
  if (!/^https:/.test(API_URL)) return Promise.reject({ message: "L'URL de l'API n'est pas configurée.", network: true });
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, args: args }),
    redirect: 'follow'
  }).then(function (r) { return r.json(); }, function () {
    throw { message: 'Connexion au serveur impossible.', network: true };
  }).then(function (data) {
    if (data && data.ok) return data.result;
    throw { message: (data && data.error) || 'Erreur serveur.' };
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}

<script>
var TOKEN_KEY = 'finances_token';
var WORK_AMOUNT = 110, RECHARGE_AMOUNT = 10;
var BILLS = [5, 10, 20, 50, 100, 200];
var SAV_CATS = [{ key: 'salary', label: 'Salaire' }, { key: 'tips', label: 'Pourboire' }];

var token = null, user = null;
var page = 'home';
var months = { home: ym(new Date()), ikea: ym(new Date()), expenses: ym(new Date()) };
var ikeaView = null;       // null = liste des sous-catégories, sinon 'overview' | 'days' | 'calendar'
var ikeaData = null;
var debtTab = 'owed_to_me';
var renderId = 0;
var toastTimer = null;

/* ---------- Outils ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return String(n).padStart(2, '0'); }
function ym(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function today() { var d = new Date(); return ym(d) + '-' + pad(d.getDate()); }
function parseD(s) { var p = String(s || '').split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function shiftMonth(m, n) { var p = m.split('-'); return ym(new Date(+p[0], +p[1] - 1 + n, 1)); }
function monthLabel(m) { var p = m.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
function dateLabel(s) { if (!s) return ''; return parseD(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function dateLong(s) { if (!s) return ''; return parseD(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }
var fmt = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
function eur(n) { return fmt.format(Math.round((Number(n) || 0) * 100) / 100).replace(/ | /g, ' '); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function num(v) { var n = Number(String(v == null ? '' : v).replace(',', '.').replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; }
function isSunday(s) { return parseD(s).getDay() === 0; }

var ICONS = {
  home: '<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',
  income: '<path d="M12 20V6"/><path d="M6 12l6-6 6 6"/><path d="M5 21h14"/>',
  expense: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
  savings: '<path d="M5 11a7 6 0 0114 0c0 2-1 3.500-2.500 4.500V19h-3v-1.500h-3V19h-3v-3.500C6 14.500 5 13 5 11z"/><path d="M19 10h2M9.500 9.500h.01"/>',
  subs: '<path d="M20 12a8 8 0 11-2.400-5.700"/><path d="M20 4v5h-5"/>',
  debts: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6.500 8-6.500s8 2.500 8 6.500"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>',
  chevR: '<path d="M9 5l7 7-7 7"/>',
  store: '<path d="M4 9l1.500-5h13L20 9"/><path d="M4 9v11h16V9"/><path d="M4 9a3 3 0 006 0 3 3 0 006 0 3 3 0 004 0"/>',
  edit: '<path d="M4 20h4L19.500 8.500a2.800 2.800 0 00-4-4L4 16v4z"/>',
  trash: '<path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  logout: '<path d="M9 4H5.500A1.500 1.500 0 004 5.500v13A1.500 1.500 0 005.500 20H9"/><path d="M16 16.500l4.500-4.500L16 7.500M20.500 12H9"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.500" cy="8.500" r="1.300"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
function ic(n, s) {
  s = s || 20;
  return '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>';
}

var NAV = [
  { key: 'home', label: 'Accueil', icon: 'home' },
  { key: 'income', label: 'Revenus', icon: 'income' },
  { key: 'expenses', label: 'Dépenses', icon: 'expense' },
  { key: 'savings', label: 'Épargne', icon: 'savings' },
  { key: 'subs', label: 'Abonnements', short: 'Abos', icon: 'subs' },
  { key: 'debts', label: 'Dettes', icon: 'debts' }
];

function toast(msg, isErr) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
}

/* ---------- Appels serveur ---------- */
function api(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  return rawApi(action, [token].concat(args)).catch(function (e) {
    if (e && /Session/i.test(e.message || '')) { logoutLocal(); showLogin('Session expirée, reconnectez-vous.'); }
    throw e;
  });
}

/* ---------- Session ---------- */
function saveToken(t) {
  try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  try { document.cookie = TOKEN_KEY + '=' + encodeURIComponent(t) + '; max-age=31536000; path=/; SameSite=Lax'; } catch (e) {}
}
function clearToken() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  try { document.cookie = TOKEN_KEY + '=; max-age=0; path=/; SameSite=Lax'; } catch (e) {}
}
function findToken() {
  var t = null;
  try { t = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!t) { try { t = sessionStorage.getItem(TOKEN_KEY); } catch (e) {} }
  if (!t) {
    try {
      String(document.cookie || '').split(';').forEach(function (p) {
        p = p.trim();
        if (p.indexOf(TOKEN_KEY + '=') === 0) t = decodeURIComponent(p.substring(TOKEN_KEY.length + 1));
      });
    } catch (e) {}
  }
  return t || null;
}
function logoutLocal() { token = null; user = null; clearToken(); }

function showLogin(msg) {
  $('restoreScreen').classList.add('hidden');
  $('app').classList.add('hidden');
  closeSheet();
  $('loginScreen').classList.remove('hidden');
  $('loginAlert').innerHTML = msg ? '<div class="alert error">' + esc(msg) + '</div>' : '';
  $('loginPass').value = '';
}

function restoreSession(t, attempt) {
  $('loginScreen').classList.add('hidden');
  $('restoreScreen').classList.remove('hidden');
  token = t;
  rawApi('getHome', [t, months.home]).then(function (data) {
    user = data.user;
    saveToken(t);
    enterApp();
  }, function (e) {
    var m = (e && e.message) || '';
    if (/Session/i.test(m)) { logoutLocal(); showLogin(); return; }
    if (attempt < 3) { setTimeout(function () { restoreSession(t, attempt + 1); }, 1500); return; }
    token = null;
    showLogin('Connexion au serveur impossible. Vérifiez internet puis rechargez la page.');
  });
}

function enterApp() {
  $('restoreScreen').classList.add('hidden');
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  buildNav();
  go('home');
}

$('loginForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { $('loginAlert').innerHTML = '<div class="alert error">Identifiant et mot de passe obligatoires.</div>'; return; }
  var b = $('loginBtn'); b.disabled = true; b.textContent = 'Connexion…';
  rawApi('login', [u, p]).then(function (r) {
    token = r.token; user = { name: r.name, username: r.username, userId: r.userId };
    saveToken(token);
    $('loginAlert').innerHTML = '';
    enterApp();
  }, function (e) {
    $('loginAlert').innerHTML = '<div class="alert error">' + esc((e && e.message) || 'Erreur') + '</div>';
  }).then(function () { b.disabled = false; b.textContent = 'Se connecter'; });
});

/* ---------- Navigation ---------- */
function buildNav() {
  $('tabbar').innerHTML = NAV.map(function (n) {
    return '<button class="tab" data-p="' + n.key + '">' + ic(n.icon, 22) + '<span>' + (n.short || n.label) + '</span></button>';
  }).join('');
  $('sidebar').innerHTML = '<div class="brand"><img src="icon-192.png" alt=""><b class="gold-text">Mes finances</b></div>' +
    NAV.map(function (n) { return '<button class="nav-item" data-p="' + n.key + '">' + ic(n.icon, 20) + n.label + '</button>'; }).join('') +
    '<div class="spacer"></div><button class="nav-item" id="menuBtnSide">' + ic('user', 20) + esc(user ? user.name : 'Compte') + '</button>';
  var els = document.querySelectorAll('[data-p]');
  for (var i = 0; i < els.length; i++) els[i].onclick = function () { ikeaView = null; go(this.getAttribute('data-p')); };
  $('menuBtnTop').innerHTML = ic('user', 20);
  $('menuBtnTop').onclick = openAccount;
  $('menuBtnSide').onclick = openAccount;
}

function go(p) {
  page = p;
  var els = document.querySelectorAll('[data-p]');
  for (var i = 0; i < els.length; i++) els[i].classList.toggle('active', els[i].getAttribute('data-p') === p);
  window.scrollTo(0, 0);
  render();
}

function render() {
  var id = ++renderId;
  var el = $('page');
  el.innerHTML = '<div class="loading"><div class="spin"></div>Chargement…</div>';
  var fn = { home: renderHome, income: renderIncome, expenses: renderExpenses, savings: renderSavings, subs: renderSubs, debts: renderDebts }[page];
  fn(function (html) {
    if (id !== renderId) return;
    el.innerHTML = html;
    afterRender();
  }, function (e) {
    if (id !== renderId) return;
    el.innerHTML = '<div class="empty">' + esc((e && e.message) || 'Erreur') + '<br><br><button class="btn btn-sm" onclick="render()">Réessayer</button></div>';
  });
}

function afterRender() {
  var el = $('page');
  var navs = el.querySelectorAll('[data-month]');
  for (var i = 0; i < navs.length; i++) navs[i].onclick = function () {
    var key = this.getAttribute('data-month-key'), n = +this.getAttribute('data-month');
    months[key] = shiftMonth(months[key], n);
    render();
  };
  var acts = el.querySelectorAll('[data-act]');
  for (var j = 0; j < acts.length; j++) acts[j].onclick = function () { actions[this.getAttribute('data-act')](this.getAttribute('data-arg')); };
  if (page === 'savings') bindSavings();
}

function monthNav(key) {
  return '<div class="month-nav"><button class="icon-btn" data-month="-1" data-month-key="' + key + '" aria-label="Mois précédent">' + ic('chevL', 20) + '</button>' +
    '<div class="lbl">' + esc(monthLabel(months[key])) + '</div>' +
    '<button class="icon-btn" data-month="1" data-month-key="' + key + '" aria-label="Mois suivant">' + ic('chevR', 20) + '</button></div>';
}

/* ---------- Fenêtres ---------- */
function openSheet(html) { $('sheet').innerHTML = html; $('sheet').scrollTop = 0; $('overlay').classList.add('show'); }
function closeSheet() { $('overlay').classList.remove('show'); }
$('overlay').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

function busy(btn, on, label) { if (!btn) return; btn.disabled = on; if (label) btn.textContent = label; }

/* ====================================================== ACCUEIL */
function renderHome(done, fail) {
  api('getHome', months.home).then(function (h) {
    var left = h.revenue.net - h.expenses.total;
    var html = monthNav('home') +
      '<div class="card hero"><div class="label">Ce qu’il reste ce mois-ci</div>' +
      '<div class="big ' + (left < 0 ? 'neg' : 'gold-text') + '">' + eur(left) + '</div>' +
      '<div class="note">' + eur(h.revenue.net) + ' de revenus − ' + eur(h.expenses.total) + ' de dépenses</div></div>' +
      '<div class="grid2">' +
        stat('Revenus', eur(h.revenue.net), h.revenue.daysWorked + ' jour(s) · IKEA', 'pos', 'income') +
        stat('Dépenses', eur(h.expenses.total), h.expenses.count + ' opération(s)', 'neg', 'expenses') +
        stat('Épargne', eur(h.savings.total), 'Salaire ' + eur(h.savings.salary), 'gold', 'savings') +
        stat('Abonnements', eur(h.subscriptions.summary.monthly), 'par mois · ' + h.subscriptions.summary.activeCount + ' actif(s)', '', 'subs') +
        stat('On me doit', eur(h.debts.owedToMe.remaining), h.debts.owedToMe.count + ' dette(s)', 'pos', 'debts', 'owed_to_me') +
        stat('Je dois', eur(h.debts.iOwe.remaining), h.debts.iOwe.count + ' dette(s)', 'neg', 'debts', 'i_owe') +
      '</div>';
    if (h.subscriptions.upcoming.length) {
      html += '<div class="card"><h3>Prochains prélèvements</h3><div class="list">' + h.subscriptions.upcoming.map(function (s) {
        return '<div class="row"><div class="dot">' + ic('clock', 20) + '</div><div class="mid"><div class="t">' + esc(s.name) + '</div><div class="d">' +
          (s.daysUntil === 0 ? 'Aujourd’hui' : s.daysUntil === 1 ? 'Demain' : 'Dans ' + s.daysUntil + ' jours') + ' · ' + esc(dateLabel(s.next)) +
          '</div></div><div class="amt">' + eur(s.amount) + '</div></div>';
      }).join('') + '</div></div>';
    }
    if (h.expenses.recent.length) {
      html += '<div class="card"><h3>Dernières dépenses</h3><div class="list">' + h.expenses.recent.map(function (e) {
        return '<div class="row"><div class="dot">' + ic('tag', 20) + '</div><div class="mid"><div class="t">' + esc(e.category) + '</div><div class="d">' +
          esc(dateLabel(e.date)) + (e.note ? ' · ' + esc(e.note) : '') + '</div></div><div class="amt neg">−' + eur(e.amount) + '</div></div>';
      }).join('') + '</div></div>';
    }
    done(html);
  }, fail);
}
function stat(k, v, s, cls, target, arg) {
  return '<div class="stat link" data-act="goto" data-arg="' + target + (arg ? ':' + arg : '') + '"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + v + '</div><div class="s">' + esc(s) + '</div></div>';
}

/* ====================================================== REVENUS / IKEA */
function renderIncome(done, fail) {
  if (!ikeaView) {
    done('<div class="page-head"><div><h2>Revenus</h2><div class="sub">Choisissez une source de revenus</div></div></div>' +
      '<div class="sub-cats"><button class="row click" data-act="openIkea"><div class="dot">' + ic('store', 22) + '</div><div class="mid"><div class="t">IKEA</div><div class="d">Journées, pourboires, recharges, calendrier</div></div>' + ic('chevR', 20) + '</button></div>');
    return;
  }
  api('getAppData', months.ikea).then(function (d) {
    ikeaData = d;
    var s = d.summary;
    var html = '<button class="back" data-act="backIncome">' + ic('chevL', 18) + 'Revenus</button>' +
      '<div class="page-head"><div><h2>IKEA</h2><div class="sub">' + esc(user ? user.name : '') + '</div></div>' +
      '<div class="head-actions"><button class="btn btn-primary btn-sm" data-act="addDay">' + ic('plus', 18) + 'Ajouter un jour</button></div></div>' +
      monthNav('ikea') +
      '<div class="seg"><button class="' + (ikeaView === 'overview' ? 'active' : '') + '" data-act="ikeaTab" data-arg="overview">Aperçu</button>' +
      '<button class="' + (ikeaView === 'days' ? 'active' : '') + '" data-act="ikeaTab" data-arg="days">Journées</button>' +
      '<button class="' + (ikeaView === 'calendar' ? 'active' : '') + '" data-act="ikeaTab" data-arg="calendar">Calendrier</button></div>';
    if (ikeaView === 'overview') html += ikeaOverview(d, s);
    else if (ikeaView === 'days') html += ikeaDays(d);
    else html += ikeaCalendar(d);
    done(html);
  }, fail);
}

function ikeaOverview(d, s) {
  var html = '<div class="card hero"><div class="label">Total net (pourboires inclus)</div><div class="big gold-text">' + eur(s.net) + '</div>' +
    '<div class="note">' + s.daysWorked + ' jour(s) travaillé(s)' + (s.daysOff ? ' · ' + s.daysOff + ' non travaillé(s)' : '') + '</div></div>' +
    '<div class="grid3">' +
      '<div class="stat"><div class="k">Net gagné</div><div class="v">' + eur(s.salary) + '</div></div>' +
      '<div class="stat"><div class="k">Pourboires</div><div class="v gold">' + eur(s.tips) + '</div></div>' +
      '<div class="stat"><div class="k">Recharges</div><div class="v blue">' + eur(s.recharge) + '</div><div class="s">' + s.rechargeCount + ' jour(s)</div></div>' +
    '</div><div class="card"><h3>Mois travaillés</h3>';
  if (!d.months.length) html += '<div class="empty">Aucun mois pour le moment.</div>';
  else html += '<div class="list">' + d.months.map(function (m) {
    return '<button class="row click" data-act="pickMonth" data-arg="' + m.month + '"><div class="mid"><div class="t" style="text-transform:capitalize">' + esc(monthLabel(m.month)) + '</div><div class="d">' + m.days + ' jour(s) · pourboires ' + eur(m.tips) + '</div></div><div class="amt gold">' + eur(m.net) + '</div></button>';
  }).join('') + '</div>';
  return html + '</div>';
}

function dayClass(e) { return e.status === 'off' ? 'off' : (e.recharge > 0 ? 'recharge' : 'worked'); }

function ikeaDays(d) {
  if (!d.entries.length) return '<div class="empty">Aucune journée ce mois-ci.<br>Touchez « Ajouter un jour ».</div>';
  return '<div class="list">' + d.entries.map(function (e) {
    var cls = e.status === 'off' ? 'red' : (e.recharge > 0 ? 'blue' : 'green');
    var det = e.status === 'off' ? 'Non travaillé' : 'Travaillé' + (e.recharge > 0 ? ' · recharge' : '') + (e.tips > 0 ? ' · pourboire ' + eur(e.tips) : '');
    return '<button class="row click" data-act="editDay" data-arg="' + esc(e.id) + '"><div class="dot ' + cls + '"><b>' + parseD(e.date).getDate() + '</b></div><div class="mid"><div class="t" style="text-transform:capitalize">' + esc(dateLabel(e.date)) + '</div><div class="d">' + esc(det) + '</div></div><div class="amt">' + (e.status === 'off' ? '—' : eur(e.net)) + '</div></button>';
  }).join('') + '</div>';
}

function ikeaCalendar(d) {
  var p = months.ikea.split('-'), y = +p[0], m = +p[1] - 1;
  var first = new Date(y, m, 1), nd = new Date(y, m + 1, 0).getDate();
  var off = (first.getDay() + 6) % 7;
  var byDate = {};
  d.entries.forEach(function (e) { byDate[e.date] = e; });
  var t = today();
  var html = '<div class="card"><div class="cal">' + ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(function (x) { return '<div class="dow">' + x + '</div>'; }).join('');
  for (var i = 0; i < off; i++) html += '<div class="cell empty-c"></div>';
  for (var day = 1; day <= nd; day++) {
    var ds = months.ikea + '-' + pad(day), e = byDate[ds];
    html += '<button class="cell ' + (e ? dayClass(e) : '') + (ds === t ? ' today' : '') + '" data-act="calDay" data-arg="' + ds + '">' + day + (e && e.status !== 'off' ? '<small>' + Math.round(e.net) + '€</small>' : '') + '</button>';
  }
  return html + '</div><div class="legend"><span><i style="background:var(--green)"></i>Travaillé</span><span><i style="background:var(--blue)"></i>Avec recharge</span><span><i style="background:var(--red)"></i>Non travaillé</span></div></div>';
}

function dayForm(e) {
  var isNew = !e.id;
  var off = e.status === 'off';
  var html = '<h3>' + (isNew ? 'Ajouter un jour' : 'Modifier le jour') + '</h3>' +
    '<div class="field"><label>Date</label><input class="input" type="date" id="dDate" value="' + esc(e.date) + '"></div>' +
    '<div class="seg work" id="dSeg"><button type="button" data-v="worked" class="on' + (off ? '' : ' active') + '">Travaillé</button><button type="button" data-v="off" class="off' + (off ? ' active' : '') + '">Non travaillé</button></div>' +
    '<div id="dFields">' +
      '<label class="switch-row"><span class="l"><b>Recharge</b><small>+ ' + eur(RECHARGE_AMOUNT) + '</small></span><span class="switch"><input type="checkbox" id="dRecharge"' + (e.recharge > 0 ? ' checked' : '') + '><i></i></span></label>' +
      '<div class="field"><label>Pourboire (€)</label><input class="input" id="dTips" inputmode="decimal" placeholder="0" value="' + (e.tips ? esc(String(e.tips).replace('.', ',')) : '') + '"></div>' +
    '</div>' +
    '<div class="preview"><span class="muted">Total du jour</span><b class="gold-text" id="dTotal">0 €</b></div>' +
    '<div class="field"><label>Note (facultatif)</label><input class="input" id="dNotes" value="' + esc(e.notes || '') + '" maxlength="200"></div>' +
    '<div class="sheet-actions">' + (isNew ? '' : '<button class="btn btn-danger" id="dDel">' + ic('trash', 18) + '</button>') +

function savingsHtml() {
  var all = savTotal('salary') + savTotal('tips');

      html += '<div class="bill" data-bill="' + b + '"><div class="glyph gold-text">' + b + ' €</div><div class="sub" id="sub_' + c.key + '_' + b + '">' + (n ? eur(n * b) : '—') + '</div>' +

    });
    html += '<div class="total-bar"><span class="muted">Total ' + c.label.toLowerCase() + '</span><b id="tot_' + c.key + '">' + eur(savTotal(c.key)) + '</b></div></div>';
  });
  return html;
}
function bindSavings() {
  var cards = document.querySelectorAll('[data-cat]');
  Array.prototype.forEach.call(cards, function (card) {
    var cat = card.getAttribute('data-cat');
    Array.prototype.forEach.call(card.querySelectorAll('.bill'), function (row) {
      var b = +row.getAttribute('data-bill'), input = row.querySelector('input');
      function set(n) {
        n = Math.min(Math.max(Math.floor(n) || 0, 0), 99999);
        input.value = n; savData[cat][b] = n;
        $('sub_' + cat + '_' + b).textContent = n ? eur(n * b) : '—';
        $('tot_' + cat).textContent = eur(savTotal(cat));
        $('savAll').textContent = eur(savTotal('salary') + savTotal('tips'));
        $('st_' + cat).textContent = 'Enregistrement…';
        clearTimeout(savTimers[cat]);
        savTimers[cat] = setTimeout(function () { saveCat(cat); }, 600);
      }
      Array.prototype.forEach.call(row.querySelectorAll('button'), function (btn) {
        btn.onclick = function () { set((+input.value || 0) + (+this.getAttribute('data-d'))); };
      });
      input.onchange = function () { set(+input.value); };
      input.onfocus = function () { this.select(); };
    });
  });
}
function saveCat(cat) {
  var counts = {}; BILLS.forEach(function (b) { counts[b] = savData[cat][b] || 0; });
  api('saveSavings', cat, counts).then(function () {
    var el = $('st_' + cat); if (el) { el.textContent = 'Enregistré ✓'; setTimeout(function () { if (el.textContent === 'Enregistré ✓') el.textContent = ''; }, 1800); }
  }, function (e) { var el = $('st_' + cat); if (el) el.textContent = 'Erreur'; toast((e && e.message) || 'Erreur', true); });
}

    $('rAll').onclick = function () {
      busy(this, true);
      api('addRepayment', id, x.remaining, today()).then(function () { toast('Dette soldée'); reload(); }, function (er) { toast(er.message, true); });
    };
  }
  var dels = $('sheet').querySelectorAll('[data-rdel]');
  for (var i = 0; i < dels.length; i++) dels[i].onclick = function () {
    api('deleteRepayment', this.getAttribute('data-rdel')).then(function () { toast('Remboursement annulé'); reload(); }, function (er) { toast(er.message, true); });
  };
}

/* ====================================================== COMPTE */
function openAccount() {
  openSheet('<h3>' + esc(user ? user.name : 'Compte') + '</h3>' +
    '<button class="btn btn-block" id="aPwd" style="margin-bottom:10px">' + ic('key', 18) + 'Changer mon mot de passe</button>' +
    '<button class="btn btn-danger btn-block" id="aOut">' + ic('logout', 18) + 'Se déconnecter</button>' +
    '<div class="sheet-actions"><button class="btn" id="aClose">Fermer</button></div>');
  $('aClose').onclick = closeSheet;
  $('aOut').onclick = function () { var t = token; rawApi('logout', [t]).catch(function () {}); logoutLocal(); showLogin(); };
  $('aPwd').onclick = passwordForm;
}
function passwordForm() {
  openSheet('<h3>Changer mon mot de passe</h3>' +
    '<div id="pAlert"></div>' +
    '<div class="field"><label>Mot de passe actuel</label><input class="input" type="password" id="pOld" autocomplete="current-password"></div>' +
    '<div class="field"><label>Nouveau mot de passe (6 caractères min.)</label><input class="input" type="password" id="pNew" autocomplete="new-password"></div>' +
    '<div class="field"><label>Confirmer le nouveau mot de passe</label><input class="input" type="password" id="pNew2" autocomplete="new-password"></div>' +
    '<div class="sheet-actions"><button class="btn" id="pCancel">Annuler</button><button class="btn btn-primary" id="pSave">Valider</button></div>');
  function err(m) { $('pAlert').innerHTML = '<div class="alert error">' + esc(m) + '</div>'; }
  $('pCancel').onclick = closeSheet;
  $('pSave').onclick = function () {
    var o = $('pOld').value, n = $('pNew').value, n2 = $('pNew2').value, b = this;
    if (!o) return err('Saisissez votre mot de passe actuel.');
    if (n.length < 6) return err('Le nouveau mot de passe doit contenir au moins 6 caractères.');
    if (n !== n2) return err('La confirmation ne correspond pas.');
    busy(b, true);
    api('changePassword', o, n).then(function () { closeSheet(); toast('Mot de passe modifié'); }, function (e) { err((e && e.message) || 'Erreur'); busy(b, false); });
  };
}

/* ====================================================== ACTIONS */
function findIn(list, id) { return list.filter(function (x) { return String(x.id) === String(id); })[0]; }
var actions = {
  goto: function (arg) {
    var p = arg.split(':');
    if (p[0] === 'income') { ikeaView = 'overview'; }
    else ikeaView = null;
    if (p[0] === 'debts' && p[1]) debtTab = p[1];
    if (p[0] === 'income') months.ikea = months.home;
    if (p[0] === 'expenses') months.expenses = months.home;
    go(p[0]);
  },
  openIkea: function () { ikeaView = 'overview'; render(); },
  backIncome: function () { ikeaView = null; render(); },
  ikeaTab: function (v) { ikeaView = v; render(); },
  pickMonth: function (m) { months.ikea = m; ikeaView = 'days'; render(); },
  addDay: function () { var d = today(); if (months.ikea !== d.substring(0, 7)) d = months.ikea + '-01'; dayForm({ date: d, status: isSunday(d) ? 'off' : 'worked', recharge: 0, tips: 0 }); },
  calDay: function (ds) {
    var e = ikeaData ? ikeaData.entries.filter(function (x) { return x.date === ds; })[0] : null;
    if (e) dayForm(e); else dayForm({ date: ds, status: isSunday(ds) ? 'off' : 'worked', recharge: 0, tips: 0 });
  },
  editDay: function (id) { var e = findIn(ikeaData.entries, id); if (e) dayForm(e); },
  addExpense: function () { expenseForm({ date: months.expenses === today().substring(0, 7) ? today() : months.expenses + '-01' }); },
  editExpense: function (id) { var e = findIn(expData.entries, id); if (e) expenseForm(e); },
  manageCats: manageCats,
  addSub: function () { subForm({}); },
  editSub: function (id) { var s = findIn(subData.subscriptions, id); if (s) subForm(s); },
  toggleSub: function (id) { api('toggleSubscription', id).then(function () { render(); }, function (e) { toast(e.message, true); render(); }); },
  addDebt: function () { debtForm({ direction: debtTab }); },
  debtTab: function (v) { debtTab = v; render(); },
  openDebt: function (id) { debtDetail(id); }
};
// les interrupteurs déclenchent "change", pas "click"
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t && t.matches && t.matches('input[data-tog]')) actions.toggleSub(t.getAttribute('data-tog'));
});

/* ---------- Démarrage ---------- */
(function init() {
  var t = findToken();
  if (t) restoreSession(t, 0); else showLogin();
})();
</script>
